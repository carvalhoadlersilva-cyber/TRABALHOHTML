<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    fieldset { border: 1px solid #000; padding: 20px; width: 300px; }
    legend { font-weight: bold; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 6px; border: 1px solid #000; box-sizing: border-box; }
    .footer-links { margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <form>
    <fieldset>
      <legend>Login</legend>
      <div class="form-group">
        <label>Login:</label>
        <input type="text" name="login" required>
      </div>
      <div class="form-group">
        <label>Senha:</label>
        <input type="password" name="senha" required>
      </div>
      <div class="form-group">
        <label><input type="checkbox"> Mantenha-me conectado</label>
      </div>
      <div class="form-group">
        <a href="#">Esqueci a senha</a>
      </div>
      <input type="submit" value="Enviar">
      <div class="footer-links">
        <p>ou <br><a href="criar_conta.html">Criar uma conta</a></p>
      </div>
    </fieldset>
  </form>
</body>
</html>
