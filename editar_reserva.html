<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Editar Reserva</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_reservas.html" class="active">Reservas</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-title">Painel de Controle</div>
      <div class="header-user">
        <a href="editar_perfil.html" style="display: flex; align-items: center; gap: 10px;">
          <img src="perfil_gerente.png" alt="Foto do Gerente" class="avatar">
          <span>João da Silva (Gerente)</span>
        </a>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <div class="page-header">
        <div>
          <span style="color: var(--text-muted); font-size: 0.85rem;">Reservas / Edição</span>
          <h2 class="page-title">Editar Reserva</h2>
        </div>
      </div>

      <!-- Card do Formulário -->
      <div class="card" style="max-width: 500px;">
        
        <!-- Resumo dos dados fixos da Reserva -->
        <div style="background-color: var(--bg-main); padding: 15px; border-radius: var(--border-radius); border: 1px solid var(--border-color); margin-bottom: 20px;">
          <div style="display: grid; grid-template-columns: auto 1fr; gap: 8px 15px; font-size: 0.95rem;">
            <span style="color: var(--text-muted); font-weight: bold;">ID:</span>
            <span>#1234</span>
            <span style="color: var(--text-muted); font-weight: bold;">Proprietário:</span>
            <span>José da Silva</span>
            <span style="color: var(--text-muted); font-weight: bold;">Pet:</span>
            <span><strong>Max</strong></span>
          </div>
        </div>

        <form action="listagem_reservas.html" method="get">

          <div class="form-group">
            <label for="anotacoes_funcionarios">Anotações dos Funcionários:</label>
            <textarea id="anotacoes_funcionarios" name="anotacoes_funcionarios" rows="4" class="form-control">Pet alimentado no horário correto. Apresenta bom comportamento.</textarea>
          </div>

          <div class="form-group">
            <label for="imagens">Adicionar Imagens:</label>
            <input type="file" id="imagens" name="imagens" multiple class="form-control" style="background-color: #fff;">
          </div>

          <div class="form-group">
            <label for="status">Status*:</label>
            <select id="status" name="status" class="form-control" required>
              <option value="Reservada">Reservada</option>
              <option value="Em progresso">Em progresso</option>
              <option value="Finalizada" selected>Finalizada</option>
            </select>
          </div>

          <div class="form-group">
            <label for="recibo">Upload do Recibo/Nota:</label>
            <input type="file" id="recibo" name="recibo" accept=".pdf,image/*" class="form-control" style="background-color: #fff;">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="listagem_reservas.html" class="btn btn-secondary">Cancelar</a>
          </div>

        </form>
      </div>
    </main>

  </div>

</body>
</html>
