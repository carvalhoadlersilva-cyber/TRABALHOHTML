<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Pet - Editar Reserva</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/navegacao.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="listagem_reservas.html" class="active">Reservas</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-user">
        <a href="editor_perfil.html">
          <img src="perfil_gerente.png" alt="Foto do Gerente" class="avatar">
          <span>João da Silva</span>
        </a>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <nav class="breadcrumb">Home / Reservas / Editar Reserva</nav>

      <section class="painel">
        <h2 class="page-title">Editar reserva</h2>
        <div class="form-wrap">
          <form action="listagem_reservas.html" method="get" enctype="multipart/form-data">
          <div class="form-group">
            <label for="proprietario">Proprietário *</label>
            <input type="text" id="proprietario" name="proprietario" class="form-control" value="José da Silva" required readonly>
          </div>
          <div class="form-group">
            <label for="pet">Pet *</label>
            <input type="text" id="pet" name="pet" class="form-control" value="Max" required readonly>
          </div>

          <div class="form-group">
            <label for="inicio">Período *</label>
            <div class="periodo">
              <input type="date" id="inicio" name="inicio" class="form-control" value="2026-08-20" required aria-label="Início">
              <input type="date" id="fim" name="fim" class="form-control" value="2026-08-25" required aria-label="Fim">
            </div>
          </div>

          <div class="form-group">
            <label for="notas">Notas</label>
            <textarea id="notas" name="notas" rows="4" class="form-control" placeholder="">Alérgico a frango.</textarea>
          </div>
          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" class="form-control" required><option value="Reservada">Reservada</option><option value="Em progresso">Em progresso</option><option value="Finalizada" selected>Finalizada</option></select>
          </div>
          <div class="form-group">
            <label for="anotacoes_funcionarios">Anotações do funcionário</label>
            <textarea id="anotacoes_funcionarios" name="anotacoes_funcionarios" rows="4" class="form-control" placeholder="">Pet alimentado no horário correto. Apresenta bom comportamento.</textarea>
          </div>

          <div class="form-group">
            <label>Imagens</label>
            <div class="thumbs">
              <span class="thumb" role="img" aria-label="Imagem atual"></span>
              <label for="imagens" class="thumb thumb-add" title="Adicionar imagens">+</label>
              <input type="file" id="imagens" name="imagens" multiple accept="image/*" class="visually-hidden">
            </div>
          </div>

          <div class="total-diarias">Total das diárias: <strong>R$ 250,00</strong></div>

          <label for="recibo" class="btn btn-roxo btn-sm ico-doc" style="margin-top: 14px;">Adicionar nota fiscal</label>
          <input type="file" id="recibo" name="recibo" accept=".pdf,image/*" class="visually-hidden">
          <div><a href="recibo.pdf" target="_blank" class="link-anexo ico-clip">recibo.pdf</a></div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary ico-save">Salvar</button>
            <button type="reset" class="btn ico-reset">Limpar</button>
          </div>
          </form>
        </div>
      </section>
    </main>

  </div>

</body>
</html>
