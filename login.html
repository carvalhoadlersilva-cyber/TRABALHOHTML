<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Hotel Pet</h1>
        <p>Acesse sua conta para gerenciar o sistema</p>
      </div>

      <form action="index.html" method="get">
        <div class="form-group">
          <label for="login">Login:</label>
          <input type="text" id="login" name="login" class="form-control" required placeholder="Digite seu usuário">
        </div>

        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" class="form-control" required placeholder="Digite sua senha">
        </div>

        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
          <label style="font-weight: normal; margin: 0; cursor: pointer;">
            <input type="checkbox"> Mantenha-me conectado
          </label>
          <a href="#" style="font-size: 0.85rem;">Esqueci a senha</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Enviar</button>
      </form>

      <div class="auth-footer">
        <p>ou</p>
        <a href="criar_conta.html" class="btn btn-secondary" style="display: block; margin-top: 10px;">Criar uma conta</a>
      </div>
    </div>
  </div>

</body>
</html>
