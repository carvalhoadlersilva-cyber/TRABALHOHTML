<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Novo Pet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #fff; color: #000; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #000; padding: 10px 20px; }
    header h1 { margin: 0; font-size: 24px; }
    .user-profile { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #000; }
    .user-profile img { border-radius: 50%; width: 40px; height: 40px; border: 1px solid #000; }
    .container { display: flex; min-height: calc(100vh - 61px); }
    nav { width: 200px; border-right: 1px solid #000; padding: 20px; }
    nav ul { list-style: none; padding: 0; margin: 0; }
    nav li { margin-bottom: 12px; }
    nav a { text-decoration: none; color: #000; font-weight: bold; }
    main { flex: 1; padding: 20px; }
    .form-container { display: flex; gap: 20px; }
    form { flex: 1; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; }
    input[type="text"], select { width: 100%; padding: 6px; border: 1px solid #000; box-sizing: border-box; }
  </style>
</head>
<body>
  <header>
    <h1>Hotel Pet</h1>
    <a href="editar_perfil.html" class="user-profile">
      <img src="perfil_gerente.png" alt="Foto do Gerente">
      <span>João da Silva (Gerente)</span>
    </a>
  </header>
  <div class="container">
    <nav>
      <ul>
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </nav>
    <main>
      <h2>Novo Pet</h2>
      <div class="form-container">
        <form>
          <div class="form-group">
            <label>Proprietário*:</label>
            <select name="proprietario" required>
              <option value="">Selecione o proprietário</option>
              <option value="1">José da Silva</option>
              <option value="2">Maria Oliveira</option>
            </select>
          </div>
          <div class="form-group">
            <label>Nome*:</label>
            <input type="text" name="nome" required>
          </div>
          <div class="form-group">
            <label>Tipo*:</label>
            <input type="text" name="tipo" required>
          </div>
          <div class="form-group">
            <label>Raça*:</label>
            <input type="text" name="raca" required>
          </div>
          <div class="form-group">
            <label>Tamanho*:</label>
            <input type="text" name="tamanho" required>
          </div>
          <div class="form-group">
            <label>Foto:</label>
            <input type="file" name="foto">
          </div>
          <br>
          <input type="submit" value="Salvar">
          <input type="reset" value="Limpar">
        </form>
        <div>
          <img src="image_1.png" alt="Cachorro e Gato" width="250" border="1">
        </div>
      </div>
    </main>
  </div>
</body>
</html>
