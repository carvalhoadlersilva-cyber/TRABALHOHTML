<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Pet - Editar Pet</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/navegacao.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html" class="active">Pets</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-user">
        <a href="editor_perfil.html">
          <img src="perfil_gerente.png" alt="Foto do Gerente" class="avatar">
          <span>João da Silva</span>
        </a>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <nav class="breadcrumb">Home / Pets / Editar Pet</nav>

      <section class="painel">
        <h2 class="page-title">Editar Pet</h2>
        <div class="form-com-imagem">
          <form action="index.html" method="get" enctype="multipart/form-data">
          <div class="form-group">
            <label for="proprietario">Proprietário *</label>
            <select id="proprietario" name="proprietario" class="form-control" required><option value="">Selecione o proprietário</option><option value="1" selected>José da Silva</option><option value="2">Maria Oliveira</option></select>
          </div>
          <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" name="nome" class="form-control" value="Max" required>
          </div>
          <div class="form-group">
            <label for="tipo">Tipo *</label>
            <select id="tipo" name="tipo" class="form-control" required><option value="">Selecione</option><option value="Cachorro" selected>Cachorro</option><option value="Gato">Gato</option></select>
          </div>
          <div class="form-group">
            <label for="raca">Raça *</label>
            <input type="text" id="raca" name="raca" class="form-control" value="Pastor Alemão" required>
          </div>
          <div class="form-group">
            <label for="tamanho">Tamanho *</label>
            <select id="tamanho" name="tamanho" class="form-control" required><option value="">Selecione</option><option value="Pequeno">Pequeno</option><option value="Médio">Médio</option><option value="Grande" selected>Grande</option></select>
          </div>
          <div class="form-group">
            <label for="foto">Alterar Foto</label>
            <input type="file" id="foto" name="foto" class="form-control">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary ico-save">Salvar</button>
            <button type="reset" class="btn ico-reset">Limpar</button>
          </div>
          </form>
          <div class="imagem-col">
            <span>Imagem</span>
            <div class="thumb img-placeholder" role="img" aria-label="Pré-visualização da imagem"></div>
          </div>
        </div>
      </section>
    </main>

  </div>

</body>
</html>
