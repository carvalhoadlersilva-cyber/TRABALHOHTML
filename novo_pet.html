<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Novo Pet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-title">Painel de Controle</div>
      <!-- Gerenciado dinamicamente pelo app.js -->
      <div class="header-user"></div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <div class="page-header">
        <div>
          <span style="color: var(--text-muted); font-size: 0.85rem;">Pets / Cadastro</span>
          <h2 class="page-title">Novo Pet</h2>
        </div>
      </div>

      <!-- Card do Formulário -->
      <div class="card">
        <div style="display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap;">
          
          <form action="index.html" method="get" style="flex: 1; min-width: 280px;">
            <div class="form-group">
              <label for="proprietario">Proprietário*:</label>
              <select id="proprietario" name="proprietario" class="form-control" required>
                <option value="">Selecione o proprietário</option>
                <option value="1">José da Silva</option>
                <option value="2">Maria Oliveira</option>
              </select>
            </div>

            <div class="form-group">
              <label for="nome">Nome*:</label>
              <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Max" required>
            </div>

            <div class="form-group">
              <label for="tipo">Tipo*:</label>
              <input type="text" id="tipo" name="tipo" class="form-control" placeholder="Ex: Cachorro, Gato" required>
            </div>

            <div class="form-group">
              <label for="raca">Raça*:</label>
              <input type="text" id="raca" name="raca" class="form-control" placeholder="Ex: Pastor Alemão" required>
            </div>

            <div class="form-group">
              <label for="tamanho">Tamanho*:</label>
              <input type="text" id="tamanho" name="tamanho" class="form-control" placeholder="Ex: Grande, Pequeno" required>
            </div>

            <div class="form-group">
              <label for="foto">Foto:</label>
              <input type="file" id="foto" name="foto" class="form-control" style="background-color: #fff;">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
              <button type="submit" class="btn btn-primary">Salvar</button>
              <a href="index.html" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>

          <!-- Imagem Lateral Ilustrativa -->
          <div style="text-align: center; width: 250px;">
            <img src="image_1.png" alt="Cachorro e Gato" style="width: 100%; border-radius: var(--border-radius); border: 1px solid var(--border-color); object-fit: cover;">
          </div>

        </div>
      </div>
    </main>

  </div>

  <!-- Inclusão do arquivo JS de navegação e lógica centralizada -->
  <script src="app.js"></script>
</body>
</html>
