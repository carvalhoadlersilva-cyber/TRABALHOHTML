<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Editar Perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-title">Painel de Controle</div>
      <!-- Gerenciado dinamicamente pelo app.js -->
      <div class="header-user"></div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <div class="page-header">
        <div>
          <span style="color: var(--text-muted); font-size: 0.85rem;">Minha Conta / Perfil</span>
          <h2 class="page-title">Editar Perfil</h2>
        </div>
      </div>

      <!-- Card do Formulário -->
      <div class="card" style="max-width: 500px;">
        <form action="index.html" method="get" enctype="multipart/form-data">
          
          <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <img src="perfil_gerente.png" alt="Foto Atual" class="avatar" style="width: 60px; height: 60px;">
            <div>
              <strong style="display: block;">João da Silva</strong>
              <span style="color: var(--text-muted); font-size: 0.85rem;">Gerente</span>
            </div>
          </div>

          <div class="form-group">
            <label for="nome">Nome*:</label>
            <input type="text" id="nome" name="nome" value="João" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" value="da Silva" class="form-control">
          </div>

          <div class="form-group">
            <label for="email">E-mail*:</label>
            <input type="email" id="email" name="email" value="joao@hotelpet.com" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone*:</label>
            <input type="tel" id="telefone" name="telefone" value="(77) 99999-8888" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="foto_perfil">Foto de Perfil:</label>
            <input type="file" id="foto_perfil" name="foto_perfil" class="form-control">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="index.html" class="btn btn-secondary">Cancelar</a>
          </div>

        </form>
      </div>
    </main>

  </div>

  <!-- Inclusão do arquivo JS de navegação e lógica centralizada -->
  <script src="app.js"></script>
</body>
</html>
