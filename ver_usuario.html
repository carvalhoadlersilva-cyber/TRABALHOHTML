<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Ver Usuário</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-title">Painel de Controle</div>
      <!-- Gerenciado dinamicamente pelo app.js -->
      <div class="header-user"></div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <div class="page-header">
        <div>
          <span style="color: var(--text-muted); font-size: 0.85rem;">Usuários / Detalhes</span>
          <h2 class="page-title">Detalhes do Usuário</h2>
        </div>
        <a href="editar_usuario.html?id=2" class="btn btn-secondary">Editar este usuário</a>
      </div>

      <!-- Card com as Informações -->
      <div class="card" style="max-width: 500px;">
        <dl style="margin: 0; display: grid; grid-template-columns: 120px 1fr; row-gap: 12px; column-gap: 10px; align-items: center;">
          <dt style="font-weight: bold; color: var(--text-muted);">ID:</dt>
          <dd style="margin: 0;">2</dd>

          <dt style="font-weight: bold; color: var(--text-muted);">Nome:</dt>
          <dd style="margin: 0; font-size: 1.05rem; font-weight: 500;">Carlos Souza</dd>

          <dt style="font-weight: bold; color: var(--text-muted);">E-mail:</dt>
          <dd style="margin: 0;">carlos@hotelpet.com</dd>

          <dt style="font-weight: bold; color: var(--text-muted);">Função:</dt>
          <dd style="margin: 0;">Funcionário</dd>

          <dt style="font-weight: bold; color: var(--text-muted);">Status:</dt>
          <dd style="margin: 0;">
            <span style="color: #2e7d32; font-weight: bold;">Ativo</span>
          </dd>
        </dl>

        <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border-color);">
          <a href="listagem_usuarios.html" class="btn btn-primary btn-voltar">Voltar para a lista</a>
        </div>
      </div>
    </main>

  </div>

  <!-- Inclusão do arquivo JS de navegação e lógica centralizada -->
  <script src="app.js"></script>
</body>
</html>
