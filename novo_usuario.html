<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Hotel Pet - Novo Usuário</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="listagem_usuarios.html">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-title">Painel de Controle</div>
      <!-- Gerenciado dinamicamente pelo app.js -->
      <div class="header-user"></div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <div class="page-header">
        <div>
          <span style="color: var(--text-muted); font-size: 0.85rem;">Usuários / Cadastro</span>
          <h2 class="page-title">Novo Usuário</h2>
        </div>
      </div>

      <!-- Card do Formulário -->
      <div class="card" style="max-width: 500px;">
        <form action="listagem_usuarios.html" method="get">
          
          <div class="form-group">
            <label for="nome">Nome Completo*:</label>
            <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite o nome completo" required>
          </div>

          <div class="form-group">
            <label for="email">E-mail*:</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
          </div>

          <div class="form-group">
            <label for="senha">Senha*:</label>
            <input type="password" id="senha" name="senha" class="form-control" placeholder="Sua senha de acesso" required>
          </div>

          <div class="form-group">
            <label for="funcao">Função*:</label>
            <select id="funcao" name="funcao" class="form-control" required>
              <option value="">Selecione uma função</option>
              <option value="Cliente">Cliente</option>
              <option value="Funcionário">Funcionário</option>
              <option value="Gerente">Gerente</option>
            </select>
          </div>

          <div class="form-group">
            <label for="status">Status*:</label>
            <select id="status" name="status" class="form-control" required>
              <option value="Ativo" selected>Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>

          <div style="display: flex; gap: 10px; margin-top: 25px;">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="listagem_usuarios.html" class="btn btn-secondary">Cancelar</a>
          </div>

        </form>
      </div>
    </main>

  </div>

  <!-- Inclusão do arquivo JS de navegação e lógica centralizada -->
  <script src="app.js"></script>
</body>
</html>
