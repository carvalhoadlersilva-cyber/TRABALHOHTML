<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Pet - Novo Usuário</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/navegacao.js"></script>
</head>
<body>

  <div class="app-container">

    <!-- Sidebar / Menu Lateral -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">Hotel Pet</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Pets</a></li>
        <li><a href="listagem_usuarios.html" class="active">Usuários</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="listagem_reservas.html">Reservas</a></li>
        <li><a href="login.html">Sair</a></li>
      </ul>
    </aside>

    <!-- Header / Cabeçalho Superior -->
    <header class="app-header">
      <div class="header-user">
        <a href="editor_perfil.html">
          <img src="perfil_gerente.png" alt="Foto do Gerente" class="avatar">
          <span>João da Silva</span>
        </a>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
      <nav class="breadcrumb">Home / Usuários / Novo Usuário</nav>

      <section class="painel">
        <h2 class="page-title">Novo Usuário</h2>
        <div class="form-wrap">
          <form action="listagem_usuarios.html" method="get">
          <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite o nome completo" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
          </div>
          <div class="form-group">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" name="senha" class="form-control" placeholder="Sua senha de acesso" required>
          </div>
          <div class="form-group">
            <label for="funcao">Função *</label>
            <select id="funcao" name="funcao" class="form-control" required><option value="">Selecione uma função</option><option value="Cliente">Cliente</option><option value="Funcionário">Funcionário</option><option value="Gerente">Gerente</option></select>
          </div>
          <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" class="form-control" required><option value="Ativo" selected>Ativo</option><option value="Inativo">Inativo</option></select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary ico-save">Salvar</button>
            <button type="reset" class="btn ico-reset">Limpar</button>
          </div>
          </form>
        </div>
      </section>
    </main>

  </div>

</body>
</html>
